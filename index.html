<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Генератор координат · Москва</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f1216; color: #e8ecf1;
    user-select: none;
  }
  body {
    display: flex; flex-direction: column;
    padding: 20px;
    max-width: 560px; margin: 0 auto;
  }
  h1 { font-size: 18px; font-weight: 600; margin: 8px 0 4px; letter-spacing: -0.3px; }
  .sub { font-size: 13px; color: #7a8696; margin-bottom: 24px; }

  .card {
    background: #171c23;
    border: 1px solid #242b35;
    border-radius: 20px;
    padding: 24px 20px;
    text-align: center;
    margin-bottom: 16px;
  }
  .label { font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px; color: #6a7686; margin-bottom: 8px; }
  .coord {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 22px; font-weight: 600;
    color: #e8ecf1;
    letter-spacing: -0.5px;
    margin: 4px 0;
    word-break: break-all;
  }
  .coord small { font-size: 13px; color: #6a7686; font-weight: 400; }
  .meta { font-size: 12px; color: #7a8696; margin-top: 14px; line-height: 1.6; }
  .meta b { color: #b8c2cf; font-weight: 500; }

  .placeholder .coord { color: #3d4756; }

  /* --- Настройки диапазона --- */
  .range-card {
    background: #171c23;
    border: 1px solid #242b35;
    border-radius: 16px;
    padding: 14px 16px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .range-card label {
    font-size: 12px;
    color: #7a8696;
    text-transform: uppercase;
    letter-spacing: 1px;
    white-space: nowrap;
  }
  .range-inputs {
    display: flex; align-items: center; gap: 8px;
    flex: 1;
  }
  .range-inputs input {
    flex: 1; min-width: 0;
    background: #0f1216;
    border: 1px solid #242b35;
    border-radius: 10px;
    color: #e8ecf1;
    font-family: ui-monospace, monospace;
    font-size: 15px;
    padding: 10px 12px;
    text-align: center;
    outline: none;
    -moz-appearance: textfield;
  }
  .range-inputs input::-webkit-outer-spin-button,
  .range-inputs input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .range-inputs input:focus { border-color: #4f8cff; }
  .range-inputs span { color: #4f5866; font-size: 14px; }

  .btn {
    display: flex; align-items: center; justify-content: center;
    width: 100%; padding: 18px;
    font-size: 16px; font-weight: 600;
    border: none; border-radius: 16px;
    cursor: pointer; transition: transform .08s, opacity .15s;
    font-family: inherit;
    margin-bottom: 10px;
  }
  .btn:active { transform: scale(0.97); }
  .btn-main {
    background: linear-gradient(135deg, #4f8cff, #2f6bff);
    color: #fff;
    box-shadow: 0 8px 24px rgba(79,140,255,.25);
  }
  .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .btn-sec {
    background: #1d242e; color: #c7d0dc;
    padding: 14px; font-size: 13px; margin-bottom: 0;
  }
  .btn-sec:disabled { opacity: .4; cursor: default; }

  /* --- Модалка ручного ввода --- */
  .modal-bg {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.7);
    display: none;
    align-items: center; justify-content: center;
    padding: 20px;
    z-index: 100;
  }
  .modal-bg.show { display: flex; }
  .modal {
    background: #171c23;
    border: 1px solid #242b35;
    border-radius: 20px;
    padding: 24px 20px;
    width: 100%; max-width: 420px;
  }
  .modal h3 { margin: 0 0 6px; font-size: 16px; }
  .modal .modal-sub { font-size: 12px; color: #7a8696; margin-bottom: 18px; }
  .modal label {
    display: block;
    font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
    color: #6a7686; margin-bottom: 6px;
  }
  .modal input {
    width: 100%;
    background: #0f1216;
    border: 1px solid #242b35;
    border-radius: 10px;
    color: #e8ecf1;
    font-family: ui-monospace, monospace;
    font-size: 16px;
    padding: 12px 14px;
    margin-bottom: 14px;
    outline: none;
  }
  .modal input:focus { border-color: #4f8cff; }

  .history { margin-top: 24px; padding-top: 20px; }
  .history-head {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 10px;
  }
  .history h2 {
    font-size: 12px; text-transform: uppercase; letter-spacing: 1.2px;
    color: #6a7686; margin: 0;
  }
  .clear-btn {
    background: none; border: none; color: #6a7686;
    font-size: 12px; cursor: pointer; padding: 4px 0;
    font-family: inherit;
  }
  .clear-btn:active { color: #b8c2cf; }

  .history-item {
    font-family: ui-monospace, monospace;
    font-size: 13px; color: #8b96a5;
    padding: 12px 14px;
    background: #171c23;
    border-radius: 10px;
    margin-bottom: 6px;
    display: flex; justify-content: space-between; align-items: center;
    gap: 10px;
    cursor: pointer;
  }
  .history-item:active { background: #1d242e; }
  .history-item .time { color: #4f5866; font-size: 11px; }
  .history-item.manual .time::before { content: '✎ '; color: #4f8cff; }
</style>
</head>
<body>

  <h1>РАНДОМАЙЗЕР</h1>
  <div class="sub">Генератор координат · радиус настраивается</div>

  <!-- Настройка диапазона -->
  <div class="range-card">
    <label>От Москвы</label>
    <div class="range-inputs">
      <input type="number" id="rangeMin" inputmode="numeric" min="0" max="2000" value="20">
      <span>—</span>
      <input type="number" id="rangeMax" inputmode="numeric" min="0" max="2000" value="200">
      <span style="white-space:nowrap;">км</span>
    </div>
  </div>

  <div class="card placeholder" id="card">
    <div class="label">Координаты</div>
    <div class="coord" id="lat">—</div>
    <div class="coord" id="lon">—</div>
    <div class="meta" id="meta">Нажми кнопку ниже, чтобы сгенерировать точку</div>
  </div>

  <button class="btn btn-main" id="gen">Сгенерировать и открыть на карте</button>

  <div class="btn-row-3">
    <button class="btn btn-sec" id="copy" disabled>📋 Копир.</button>
    <button class="btn btn-sec" id="maps" disabled>🗺 Карта</button>
    <button class="btn btn-sec" id="manual">✎ Вручную</button>
  </div>

  <div class="history" id="historyWrap" style="display:none">
    <div class="history-head">
      <h2>История</h2>
      <button class="clear-btn" id="clearHistory">Очистить</button>
    </div>
    <div id="history"></div>
  </div>

  <!-- Модалка ручного ввода -->
  <div class="modal-bg" id="modalBg">
    <div class="modal">
      <h3>Добавить точку вручную</h3>
      <div class="modal-sub">Введи координаты в градусах, точка добавится в историю и откроется на карте</div>

      <label>Широта (lat)</label>
      <input type="text" id="mLat" inputmode="decimal" placeholder="55.7558">

      <label>Долгота (lon)</label>
      <input type="text" id="mLon" inputmode="decimal" placeholder="37.6173">

      <div class="btn-row">
        <button class="btn btn-sec" id="mCancel">Отмена</button>
        <button class="btn btn-main" id="mAdd" style="margin-bottom:0;">Добавить</button>
      </div>
    </div>
  </div>

<script>
(function () {
  // ---------- Константы ----------
  const CENTER_LAT = 55.7558;         // центр МКАДа
  const CENTER_LON = 37.6173;
  const MKAD_RADIUS_KM = 18;
  const KM_PER_DEG_LAT = 111.32;

  const STORAGE_KEY = 'coord_history_v1';
  const RANGE_KEY = 'coord_range_v1';
  const MAX_HISTORY = 20;

  let current = null;
  let history = [];

  const $ = id => document.getElementById(id);

  // ---------- Хранилище ----------
  function loadHistory() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) history = JSON.parse(raw);
    } catch (e) {
      console.warn('Не удалось загрузить историю:', e);
      history = [];
    }
  }

  function saveHistory() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
    } catch (e) {
      console.warn('Не удалось сохранить историю:', e);
    }
  }

  function loadRange() {
    try {
      const raw = localStorage.getItem(RANGE_KEY);
      if (raw) {
        const { min, max } = JSON.parse(raw);
        if (typeof min === 'number' && typeof max === 'number') {
          $('rangeMin').value = min;
          $('rangeMax').value = max;
        }
      }
    } catch (e) { /* ignore */ }
  }

  function saveRange() {
    const min = parseFloat($('rangeMin').value);
    const max = parseFloat($('rangeMax').value);
    try {
      localStorage.setItem(RANGE_KEY, JSON.stringify({ min, max }));
    } catch (e) { /* ignore */ }
  }

  // Возвращает валидный диапазон {min, max} в км от МКАДа
  function getRange() {
    let min = parseFloat($('rangeMin').value);
    let max = parseFloat($('rangeMax').value);
    if (!isFinite(min) || min < 0) min = 0;
    if (!isFinite(max) || max < 0) max = 200;
    if (min > max) [min, max] = [max, min];   // на всякий — меняем местами
    return { min, max };
  }

  // ---------- Генерация точки ----------
  function randomPoint() {
    const { min, max } = getRange();

    // границы в км от центра (МКАД + смещение)
    const rMin = MKAD_RADIUS_KM + min;
    const rMax = MKAD_RADIUS_KM + max;

    let r;
    if (rMax <= rMin) {
      r = rMin;
    } else {
      // Равномерно по площади кольца
      r = Math.sqrt(rMin * rMin + Math.random() * (rMax * rMax - rMin * rMin));
    }

    const theta = Math.random() * Math.PI * 2;
    const dLat = (r * Math.cos(theta)) / KM_PER_DEG_LAT;
    const lat = CENTER_LAT + dLat;
    const lon = CENTER_LON + (r * Math.sin(theta)) / (KM_PER_DEG_LAT * Math.cos(lat * Math.PI / 180));

    return { lat, lon, r };
  }

  const fmt = (v, d = 5) => v.toFixed(d);

  // ---------- Отрисовка ----------
  function render(point) {
    $('lat').innerHTML = fmt(point.lat) + ' <small>°N</small>';
    $('lon').innerHTML = fmt(point.lon) + ' <small>°E</small>';

    // если у точки известен радиус — показываем расстояние от МКАДа
    if (typeof point.r === 'number') {
      const distFromMkad = point.r - MKAD_RADIUS_KM;
      $('meta').innerHTML = `От МКАДа: <b>${distFromMkad.toFixed(1)} км</b>`;
    } else {
      // введено вручную — считаем реальное расстояние до центра
      const dLatKm = (point.lat - CENTER_LAT) * KM_PER_DEG_LAT;
      const dLonKm = (point.lon - CENTER_LON) * KM_PER_DEG_LAT * Math.cos(point.lat * Math.PI / 180);
      const distKm = Math.sqrt(dLatKm * dLatKm + dLonKm * dLonKm);
      const fromMkad = distKm - MKAD_RADIUS_KM;
      $('meta').innerHTML = fromMkad > 0
        ? `От МКАДа: <b>${fromMkad.toFixed(1)} км</b>`
        : `<b>Внутри МКАДа</b> (${distKm.toFixed(1)} км от центра)`;
    }

    $('card').classList.remove('placeholder');
    $('copy').disabled = false;
    $('maps').disabled = false;
  }

  function timeAgo(ts) {
    const diff = Math.floor((Date.now() - ts) / 1000);
    if (diff < 60) return 'только что';
    if (diff < 3600) return Math.floor(diff / 60) + ' мин';
    if (diff < 86400) return Math.floor(diff / 3600) + ' ч';
    return Math.floor(diff / 86400) + ' д';
  }

  function renderHistory() {
    if (history.length === 0) {
      $('historyWrap').style.display = 'none';
      return;
    }
    $('historyWrap').style.display = 'block';
    $('history').innerHTML = history
      .map(h => `<div class="history-item${h.manual ? ' manual' : ''}" data-ts="${h.ts}">
        <span>${h.text}</span>
        <span class="time">${timeAgo(h.ts)}</span>
      </div>`)
      .join('');

    [...$('history').children].forEach((el, i) => {
      el.onclick = () => openGoogleMaps(history[i]);
    });
  }

  function pushHistory(point, manual = false) {
    const text = `${fmt(point.lat)}, ${fmt(point.lon)}`;
    if (history[0]?.text === text) return;
    history.unshift({
      text,
      lat: point.lat,
      lon: point.lon,
      ts: Date.now(),
      manual
    });
    if (history.length > MAX_HISTORY) history.length = MAX_HISTORY;
    saveHistory();
    renderHistory();
  }

  // ---------- Google Maps ----------
  function openGoogleMaps(point) {
    const url = `https://www.google.com/maps/search/?api=1&query=${point.lat},${point.lon}`;
    window.open(url, '_blank', 'noopener');
  }

  // ---------- Инициализация ----------
  loadHistory();
  loadRange();
  renderHistory();

  // ---------- Кнопки ----------
  $('gen').onclick = () => {
    current = randomPoint();

    // ВАЖНО: открываем карту первым делом, синхронно внутри клика
    openGoogleMaps(current);

    render(current);
    pushHistory(current, false);
    saveRange();

    if (navigator.vibrate) navigator.vibrate(15);
  };

  $('copy').onclick = async () => {
    if (!current) return;
    const text = `${fmt(current.lat)}, ${fmt(current.lon)}`;
    try {
      await navigator.clipboard.writeText(text);
      const btn = $('copy');
      const old = btn.textContent;
      btn.textContent = '✓ Скопир.';
      setTimeout(() => btn.textContent = old, 1200);
      if (navigator.vibrate) navigator.vibrate(10);
    } catch (e) {
      prompt('Скопируй координаты:', text);
    }
  };

  $('maps').onclick = () => current && openGoogleMaps(current);

  $('clearHistory').onclick = () => {
    if (!confirm('Удалить всю историю?')) return;
    history = [];
    saveHistory();
    renderHistory();
  };

  // ---------- Модалка «Вручную» ----------
  const modalBg = $('modalBg');

  function openModal() {
    $('mLat').value = '';
    $('mLon').value = '';
    modalBg.classList.add('show');
    setTimeout(() => $('mLat').focus(), 100);
  }

  function closeModal() {
    modalBg.classList.remove('show');
  }

  $('manual').onclick = openModal;
  $('mCancel').onclick = closeModal;
  modalBg.onclick = (e) => { if (e.target === modalBg) closeModal(); };

  $('mAdd').onclick = () => {
    // поддержка запятой как разделителя
    const latRaw = $('mLat').value.trim().replace(',', '.');
    const lonRaw = $('mLon').value.trim().replace(',', '.');
    const lat = parseFloat(latRaw);
    const lon = parseFloat(lonRaw);

    if (!isFinite(lat) || lat < -90 || lat > 90) {
      alert('Широта должна быть числом от -90 до 90');
      return;
    }
    if (!isFinite(lon) || lon < -180 || lon > 180) {
      alert('Долгота должна быть числом от -180 до 180');
      return;
    }

    const point = { lat, lon };  // без r → render посчитает расстояние сам
    closeModal();

    // карта — синхронно
    openGoogleMaps(point);

    current = point;
    render(point);
    pushHistory(point, true);

    if (navigator.vibrate) navigator.vibrate(15);
  };
})();
</script>
</body>
</html>
